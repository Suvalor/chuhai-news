<!doctype html>
<html lang="{{ 'en' if ui == 'en' else 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="{{ robots }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:site_name" content="chuhainews">
<meta property="og:type" content="{{ og_type | default('website') }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:locale" content="{{ 'en_US' if ui == 'en' else 'zh_CN' }}">
{% if image %}<meta property="og:image" content="{{ image }}">
<meta name="twitter:image" content="{{ image }}">{% endif %}
<meta name="twitter:card" content="{{ 'summary_large_image' if image else 'summary' }}">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="theme-color" content="#f5f2ec">
{% if md_url %}<link rel="alternate" type="text/markdown" href="{{ md_url }}">{% endif %}
<link rel="alternate" type="application/rss+xml" title="chuhainews" href="{{ base }}/feed.xml">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ asset('site.css') }}">
{% if view == 'excel-ratio' %}<link rel="stylesheet" href="{{ asset('excel-ratio-converter.css') }}">{% endif %}
{% for x in ld or [] %}<script type="application/ld+json">{{ x | tojson }}</script>
{% endfor %}
</head>
<body data-view="{{ view }}" data-ui="{{ ui }}">
<a class="skip" href="#main">{{ '跳到正文' if ui == 'zh' else 'Skip to content' }}</a>
{% block body %}{% endblock %}
<script>window.CHUHAI = {{ {"ui": ui, "keysSearch": "/search"} | tojson }};</script>
<script src="{{ asset('site.js') }}" defer></script>
</body>
</html>
