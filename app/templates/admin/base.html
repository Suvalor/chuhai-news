<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>{% block title %}后台{% endblock %} · chuhainews</title>
<link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="{{ asset('admin.css') }}"></head><body>
<header class="top"><a class="logo" href="/admin">chuhai<b>ADMIN</b></a>
<nav>{% for href, label in [('/admin', '文章'), ('/admin/authors', '作者'), ('/admin/categories', '类目'), ('/admin/webhooks', 'WebHook')] %}<a href="{{ href }}" class="{{ 'on' if request.url.path == href }}">{{ label }}</a>{% endfor %}</nav>
<span class="sp"></span><a href="/" target="_blank">查看前台 ↗</a>
<form method="post" action="/admin/logout" class="inline"><button class="ghost sm">退出</button></form></header>
<main>{% block main %}{% endblock %}</main></body></html>
